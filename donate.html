<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - The Lunchbox Fund</title>
    <link rel="stylesheet" href="./css_assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-top">
              <img src="./images/newLogogreenicon.png" alt="The Lunchbox Fund logo" class="logo-image">
              <div class="header-copy">
                  <h1>The Lunchbox Fund</h1>
                  <p>Transforming a child's education, one meal at a time</p>
              </div>
         
        </div>

        <nav class="navbar" aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="programs.html">Programs</a></li>
                <li><a href="donate.html" class="active">Donate</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="enquiry.html">Enquiries</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-section">
        <div class="container">
            <div class="section-heading">
                <h2>Support Our Cause</h2>
                <p>Your donation helps provide nutritious meals to children in need.</p>
            </div>

            <div class="form-card">
                <form>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address">
                    </div>

                    <div class="form-group">
                        <label for="amount">Donation Amount</label>
                        <select id="amount" name="amount">
                            <option value="">Select an amount</option>
                            <option value="50">R50</option>
                            <option value="100">R100</option>
                            <option value="250">R250</option>
                            <option value="500">R500</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Optional message for the team"></textarea>
                    </div>

                    <button type="submit" class="btn">Donate Now</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
         <p>&copy; 2026 The Lunchbox Fund.</p>
    </footer>
</body>
</html>
